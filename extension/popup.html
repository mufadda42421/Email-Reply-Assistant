<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Reply Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="3"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">Email Reply Assistant</h1>
          <p class="brand-tagline">Reply smarter. Write faster.</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="detectGmailBtn" class="icon-btn" title="Detect email in open tab / Gmail">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="m10 15 5-3-5-3v6Z"></path>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings & Preferences">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- Quick Tools Tab Bar -->
    <nav class="mode-tabs">
      <button class="mode-tab active" data-mode="reply">Reply Generator</button>
      <button class="mode-tab" data-mode="improve">Quick Polish</button>
    </nav>

    <!-- Notification Toast / Banner -->
    <div id="statusBanner" class="status-banner hidden"></div>

    <main class="content-scroll">
      <!-- Section: Reply Generator Mode -->
      <div id="replyModeView" class="view-panel active">
        <!-- Email Input Card -->
        <div class="card input-card">
          <div class="card-header">
            <label for="emailInput" class="field-label">
              <span>Received Email Content</span>
              <span id="charCount" class="badge-count">0 chars</span>
            </label>
            <button id="clearBtn" class="text-action-btn" title="Clear input">Clear</button>
          </div>
          <textarea
            id="emailInput"
            class="textarea-input"
            rows="4"
            placeholder="Paste your received email here... (or click detect to grab from Gmail)"
          ></textarea>
        </div>

        <!-- Reply Configuration -->
        <div class="card config-card">
          <div class="config-grid">
            <!-- Tone selector -->
            <div class="config-field">
              <label for="toneSelect" class="config-label">Tone</label>
              <select id="toneSelect" class="select-input">
                <option value="Professional" selected>Professional</option>
                <option value="Friendly">Friendly</option>
                <option value="Casual">Casual</option>
                <option value="Formal">Formal</option>
                <option value="Persuasive">Persuasive</option>
                <option value="Apologetic">Apologetic</option>
              </select>
            </div>

            <!-- Length selector -->
            <div class="config-field">
              <label for="lengthSelect" class="config-label">Length</label>
              <select id="lengthSelect" class="select-input">
                <option value="Short">Short</option>
                <option value="Medium" selected>Medium</option>
                <option value="Detailed">Detailed</option>
              </select>
            </div>

            <!-- Language selector -->
            <div class="config-field full-width">
              <label for="languageSelect" class="config-label">Language</label>
              <select id="languageSelect" class="select-input">
                <option value="English" selected>English (US/UK)</option>
                <option value="Spanish">Spanish (Español)</option>
                <option value="French">French (Français)</option>
                <option value="German">German (Deutsch)</option>
                <option value="Portuguese">Portuguese (Português)</option>
                <option value="Italian">Italian (Italiano)</option>
                <option value="Dutch">Dutch (Nederlands)</option>
                <option value="Japanese">Japanese (日本語)</option>
                <option value="Mandarin">Mandarin (中文)</option>
                <option value="Hindi">Hindi (हिंदी)</option>
              </select>
            </div>

            <!-- Custom instructions -->
            <div class="config-field full-width">
              <label for="customInstructions" class="config-label">
                Custom Instructions <span class="optional-tag">(optional)</span>
              </label>
              <input
                type="text"
                id="customInstructions"
                class="text-field"
                placeholder="e.g., Decline politely, suggest Friday 3pm..."
              />
            </div>
          </div>

          <!-- Primary Action Button -->
          <button id="generateBtn" class="primary-btn">
            <span class="btn-spinner hidden" id="generateSpinner"></span>
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"></path>
            </svg>
            <span id="generateBtnText">Generate 3 AI Replies</span>
          </button>
        </div>

        <!-- Generated Replies Container -->
        <section id="repliesSection" class="replies-section hidden">
          <div class="section-title-row">
            <h2 class="section-heading">Generated Alternatives</h2>
            <button id="regenerateAllBtn" class="refresh-btn" title="Regenerate all 3 replies">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                <path d="M8 16H3v5"></path>
              </svg>
              <span>Refresh All</span>
            </button>
          </div>

          <!-- Context brief summary -->
          <div id="emailAnalysisBox" class="analysis-box hidden"></div>

          <!-- 3 reply cards -->
          <div id="replyCardsContainer" class="replies-list">
            <!-- Dynamically populated -->
          </div>
        </section>
      </div>

      <!-- Section: Improve / Quick Polish Mode -->
      <div id="improveModeView" class="view-panel">
        <div class="card input-card">
          <div class="card-header">
            <label for="draftToImprove" class="field-label">Draft Email to Polish</label>
            <button id="clearImproveBtn" class="text-action-btn">Clear</button>
          </div>
          <textarea
            id="draftToImprove"
            class="textarea-input"
            rows="5"
            placeholder="Type or paste an email draft you want to improve..."
          ></textarea>
        </div>

        <!-- Transform options -->
        <div class="improve-actions-grid">
          <button class="improve-chip-btn" data-action="grammar">
            <span class="chip-icon">✨</span>
            <div class="chip-text">
              <strong>Fix Grammar</strong>
              <small>Spelling & typos</small>
            </div>
          </button>
          <button class="improve-chip-btn" data-action="professional">
            <span class="chip-icon">👔</span>
            <div class="chip-text">
              <strong>More Professional</strong>
              <small>Executive tone</small>
            </div>
          </button>
          <button class="improve-chip-btn" data-action="shorter">
            <span class="chip-icon">✂️</span>
            <div class="chip-text">
              <strong>Make Shorter</strong>
              <small>Crisp & concise</small>
            </div>
          </button>
          <button class="improve-chip-btn" data-action="friendlier">
            <span class="chip-icon">🤝</span>
            <div class="chip-text">
              <strong>Make Friendlier</strong>
              <small>Warm & engaging</small>
            </div>
          </button>
        </div>

        <button id="fullImproveBtn" class="primary-btn mt-3" data-action="improve">
          <span class="btn-spinner hidden" id="improveSpinner"></span>
          <span>Comprehensive Polish</span>
        </button>

        <!-- Result Box -->
        <div id="improvedResultCard" class="card result-card hidden">
          <div class="card-header">
            <span class="badge badge-accent">Improved Email</span>
            <div class="card-actions">
              <button id="copyImprovedBtn" class="small-action-btn" title="Copy to clipboard">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                </svg>
                <span>Copy</span>
              </button>
              <button id="insertImprovedGmailBtn" class="small-action-btn primary" title="Insert into Gmail compose">
                <span>Insert to Gmail</span>
              </button>
            </div>
          </div>
          <div id="improvedExplanation" class="explanation-pill"></div>
          <textarea id="improvedTextArea" class="textarea-input editable-output" rows="6"></textarea>
          <div id="improvedKeyChanges" class="key-changes-list"></div>
        </div>
      </div>
    </main>

    <!-- Footer Status -->
    <footer class="app-footer">
      <div class="footer-status">
        <span class="status-indicator"></span>
        <span class="status-text">Gemini AI Engine Ready</span>
      </div>
      <a href="#" id="openOptionsLink" class="footer-link">Options</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
